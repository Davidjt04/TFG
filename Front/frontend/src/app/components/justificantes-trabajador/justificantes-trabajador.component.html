<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <!-- Título -->
      <div class="text-center mb-4">
        <h2>Gestión de Horarios</h2>
        <p class="text-muted">Seleccione la fecha y la hora que desea marcar como no disponible</p>
      </div>

      <!-- Mensajes de error o éxito -->
      <div *ngIf="mensaje" class="alert alert-info">
        {{ mensaje }}
      </div>

      <!-- Selector de fecha -->
      <div class="mb-3">
        <label for="fecha" class="form-label">Fecha:</label>
        <input
          type="date"
          id="fecha"
          class="form-control"
          [(ngModel)]="fechaSeleccionada"
          (change)="onFechaCambio(fechaSeleccionada)"
        />
      </div>

      <!-- Horas disponibles -->
      <div *ngIf="horasDisponibles && horasDisponibles.length > 0" class="mb-3">
        <label class="form-label">Horas disponibles:</label>
        <select class="form-select" [(ngModel)]="horaSeleccionada">
          <option *ngFor="let hora of horasDisponibles" [value]="hora">
            {{ hora }}
          </option>
        </select>
      </div>

      <div *ngIf="horasDisponibles && horasDisponibles.length === 0" class="alert alert-warning">
        No hay horas disponibles para la fecha seleccionada.
      </div>

      <!-- Botón marcar hora no disponible -->
      <div class="text-center">
        <button
          class="btn btn-primary"
          [disabled]="!horaSeleccionada || !fechaSeleccionada"
          (click)="marcarHora()"
        >
          Marcar hora como no disponible
        </button>
      </div>

    </div>
  </div>
</div>
