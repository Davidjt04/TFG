<div class="container mt-4">

  <!-- Spinner mientras carga -->
  <div *ngIf="cargando" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Mensaje si el carrito está vacío -->
  <div *ngIf="!cargando && carrito.length === 0" class="alert alert-info text-center">
    Tu carrito está vacío.
  </div>

  <!-- Lista de artículos en el carrito -->
  <div *ngIf="!cargando && carrito.length > 0">
    <div *ngFor="let item of carrito" class="card mb-3 shadow-sm">
      <div class="row g-0 align-items-center">

        <!-- Imagen del artículo -->
        <div class="col-md-2 text-center p-2">
          <img [src]="'/assets/images/' + item.article.imagen" 
               class="img-fluid rounded" 
               [alt]="item.article.nombre" 
               onerror="this.src='/assets/images/placeholder.png'">
        </div>

        <!-- Detalles del artículo -->
        <div class="col-md-6">
          <div class="card-body">
            <h5 class="card-title">{{ item.article.nombre }}</h5>
            <p class="card-text">{{ item.article.descripcion }}</p>
            <p class="card-text"><strong>Precio:</strong> {{ item.article.precio | currency:'EUR' }}</p>
          </div>
        </div>

        <!-- Cantidad y acciones -->
        <div class="col-md-4">
          <div class="d-flex flex-column align-items-center justify-content-center h-100 p-2">

            <!-- Control de cantidad -->
            <div class="input-group mb-2" style="width: 130px;">
              <button class="btn btn-outline-secondary" type="button" (click)="disminuirCantidad(item)" [disabled]="cargando">-</button>
              <input type="number" class="form-control text-center" [value]="item.cantidad" readonly>
              <button class="btn btn-outline-secondary" type="button" (click)="incrementarCantidad(item)" [disabled]="cargando">+</button>
            </div>

            <!-- Botón eliminar -->
            <button class="btn btn-danger btn-sm w-100 mb-2" (click)="borrarArticulo(item)">
              Eliminar
            </button>

            <!-- Subtotal por artículo -->
            <p class="mb-0"><strong>Subtotal:</strong> {{ item.cantidad * item.article.precio | currency:'EUR' }}</p>
          </div>
        </div>

      </div>
    </div>

    <!-- Total y checkout -->
    <div class="card shadow-sm mt-3 p-3">
      <div class="d-flex justify-content-between align-items-center">
        <h5>Total:</h5>
          <h5>{{ totalCarrito | currency:'EUR':'symbol':'1.2-2' }}</h5>
      </div>
      <button class="btn btn-success w-100 mt-3">Ir a pagar</button>
    </div>

  </div>
</div>
