<div class="container mt-4">

  <!-- Spinner mientras carga -->
  <div *ngIf="cargando" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Mensaje si no hay artículos -->
  <div *ngIf="!cargando && articulos.length === 0" class="alert alert-info text-center">
    No hay artículos disponibles.
  </div>

  <!-- Lista de artículos -->
  <div class="row">
    <div *ngFor="let articulo of articulos" class="col-md-4 mb-4">
      <div class="card h-100 shadow-sm">
        <img [src]="articulo.imagen" class="card-img-top" [alt]="articulo.nombre" style="height: 200px; object-fit: cover;">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ articulo.nombre }}</h5>
          <p class="card-text flex-grow-1">{{ articulo.descripcion }}</p>
          <p class="card-text">
            <strong>Precio:</strong> {{ articulo.precio | currency:'EUR' }}
          </p>
          <p class="card-text">
            <strong>Categoría:</strong> {{ articulo.categorta }}
          </p>

          <!-- Cantidad a añadir -->
          <div class="input-group mb-3">
            <span class="input-group-text">Cantidad</span>
            <input type="number" class="form-control" [(ngModel)]="articulo.cantidadSeleccionada" min="1" [value]="1">
          </div>

          <!-- Botón agregar al carrito -->
          <button class="btn btn-success w-100" (click)="agregarAlCarrito(articulo)">
            Agregar al carrito
          </button>

          <!-- Feedback visual al agregar -->
          <div *ngIf="articulo.exitoAgregar" class="alert alert-success mt-2 p-2 text-center" role="alert">
            ¡Artículo agregado al carrito!
          </div>
          <div *ngIf="articulo.errorAgregar" class="alert alert-danger mt-2 p-2 text-center" role="alert">
            Error al agregar al carrito.
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
