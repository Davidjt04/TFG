
<div class="container py-4">
  <h3 class="mb-4">Formulario paso a paso</h3>

  <!-- Barra de progreso -->
  <div class="progress mb-3">
    <div class="progress-bar" [style.width.%]="progressWidth"></div>
  </div>

  <!-- Stepper -->
  <div #stepperEl id="stepper" class="bs-stepper">
    <div class="bs-stepper-header" role="tablist">
      <div class="step" data-target="#step-1">
        <button type="button" class="step-trigger">
          <span class="bs-stepper-circle">1</span>
          <span class="bs-stepper-label">Elegir corte</span>
        </button>
      </div>
      <div class="line"></div>
      <div class="step" data-target="#step-2">
        <button type="button" class="step-trigger">
          <span class="bs-stepper-circle">2</span>
          <span class="bs-stepper-label">Fecha y hora</span>
        </button>
      </div>
      <div class="line"></div>
      <div class="step" data-target="#step-3">
        <button type="button" class="step-trigger">
          <span class="bs-stepper-circle">3</span>
          <span class="bs-stepper-label">Trabajador</span>
        </button>
      </div>
    </div>

    <div class="bs-stepper-content">

      <!-- Paso 1: Seleccionar corte y servicios -->
      <div id="step-1" class="content" role="tabpanel">
        <form #form1="ngForm" novalidate>
          <div class="mb-3">
            <label class="form-label fw-bold">Cortes disponibles</label>
            <div class="row row-cols-1 row-cols-md-3 g-4">
              <div class="col" *ngFor="let corte of listaPredefCut">
                <div class="card h-100 shadow-sm"
     [ngClass]="{'border-primary border-3': corte === PredefinedCutSeleccionado}"
     (click)="seleccionarCorte(corte)">

                  <img [src]="'http://localhost:8081/img/' + corte.imagen" class="card-img-top" [alt]="corte.nombre">
                  <div class="card-body">
                    <h5 class="card-title">{{ corte.nombre }}</h5>
                    <p class="card-text">Duración: {{ corte.duracion_Base }} min</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Servicios adicionales -->
          <div class="mb-3">
            <label class="form-label fw-bold">Servicios adicionales</label>
            <select class="form-select" multiple [(ngModel)]="ServiceSeleccionado" name="ServiciosSeleccionados" (change)="calcularTotal()">
              <option *ngFor="let servicio of listaServices" [ngValue]="servicio">
                {{ servicio.nombre }} - {{ servicio.precio | currency:'EUR':'symbol':'1.0-0' }}
              </option>
            </select>
          </div>

          <div class="mt-2">
            <strong>Total: {{ totalSeleccionado | currency:'EUR':'symbol':'1.0-0' }}</strong>
          </div>

          <div class="d-flex justify-content-end mt-3">
            <button type="button" class="btn btn-primary" (click)="next(form1)" [disabled]="!PredefinedCutSeleccionado && ServiceSeleccionado.length === 0"
>
              Siguiente
            </button>
          </div>
        </form>
      </div>

      <!-- Paso 2: Seleccionar fecha y hora -->
<div id="step-2" class="content" role="tabpanel">
  <form #form2="ngForm" novalidate>
    <div class="mb-3">
      <label class="form-label">Fecha</label>
      <input
        type="date"
        class="form-control"
        [(ngModel)]="fechaSeleccionada"
        name="fecha"
        (change)="cargarHorasDisponibles()"
        required
      >
    </div>

    <!-- Solo mostrar si hay horas disponibles -->
    <div class="mb-3" *ngIf="listaHorasDisponibles.length > 0">
  <label class="form-label">Horas disponibles</label>
  <select 
    [(ngModel)]="horaSeleccionada" 
    name="hora" 
    class="form-select"
    required
  >
    <option *ngFor="let h of listaHorasDisponibles" [value]="h">{{ h }}</option>
  </select>
</div>


    <div class="d-flex justify-content-between">
      <button type="button" class="btn btn-secondary" (click)="prev()">Anterior</button>
      <button type="button" class="btn btn-primary" (click)="next(form2)" [disabled]="!horaSeleccionada">Siguiente</button>
    </div>
  </form>
</div>
      <!-- Paso 3: Seleccionar peluquero -->

<div id="step-3" class="content" role="tabpanel">
  <div *ngIf="listaTrabajadoresDisponibles.length > 0" class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let trabajador of listaTrabajadoresDisponibles">
      <div
        class="card h-100 shadow-sm"
        [ngClass]="{'border-primary border-3': trabajador === trabajadorSeleccionado}"
        (click)="trabajadorSeleccionado = trabajador"
        style="cursor:pointer;"
      >
        <img
          [src]="'/assets/trabajadores/' + trabajador.imagen"
          class="card-img-top"
          [alt]="trabajador.nombre"
        >
        <div class="card-body">
          <h5 class="card-title">{{ trabajador.nombre }}</h5>
          <p class="card-text mb-0">
            <strong>Especialidad:</strong> {{ trabajador.especializacion }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="listaTrabajadoresDisponibles.length === 0" class="text-muted">
    Selecciona fecha y hora para ver trabajadores disponibles.
  </div>

  <div class="d-flex justify-content-between mt-3">
    <button type="button" class="btn btn-secondary" (click)="prev()">Anterior</button>
    <button type="button" class="btn btn-success" (click)="finish()" [disabled]="!trabajadorSeleccionado">
      Finalizar
    </button>
  </div>
</div>




    </div>
  </div>
</div>
