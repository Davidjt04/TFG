<div class="container mt-4">

  <h2 class="text-center mb-4">🛍️ Administrar Tienda</h2>

  <!-- Loader -->
  <div *ngIf="cargando" class="text-center">
    <div class="spinner-border"></div>
    <p>Cargando artículos...</p>
  </div>

  <!-- Lista de artículos -->
  <div class="row" *ngIf="!cargando && articulos.length > 0">
    <div class="col-md-4 mb-4" *ngFor="let articulo of articulos">
      <div class="card h-100 shadow">

        <img
          [src]="articulo.imagen"
          class="card-img-top"
          alt="{{ articulo.nombre }}"
          style="height: 220px; object-fit: cover;"
        >

        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ articulo.nombre }}</h5>
          <p class="card-text">{{ articulo.descripcion }}</p>
          <p class="fw-bold text-success fs-5">{{ articulo.precio }} €</p>
          <span class="badge bg-primary mb-3">{{ articulo.categorta }}</span>

          <div class="mt-auto d-flex gap-2">
            <button class="btn btn-warning flex-fill" (click)="abrirModal(articulo)">
              ✏️ Editar
            </button>
            <button class="btn btn-danger flex-fill" (click)="borrarArticulo(articulo.idArticulo)">
              🗑️ Borrar
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Mensaje si no hay artículos -->
  <div *ngIf="!cargando && articulos.length === 0" class="alert alert-warning text-center">
    No hay artículos en la tienda.
  </div>

</div>

<!-- Modal -->
<div class="modal fade show d-block" tabindex="-1" *ngIf="mostrarModal" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Artículo</h5>
        <button type="button" class="btn-close" (click)="cerrarModal()"></button>
      </div>
      <div class="modal-body" *ngIf="articuloSeleccionado">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="articuloSeleccionado.nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" [(ngModel)]="articuloSeleccionado.descripcion"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Imagen URL</label>
          <input class="form-control" [(ngModel)]="articuloSeleccionado.imagen">
        </div>
        <div class="mb-3">
          <label class="form-label">Precio</label>
          <input type="number" class="form-control" [(ngModel)]="articuloSeleccionado.precio">
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <input class="form-control" [(ngModel)]="articuloSeleccionado.categorta">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button class="btn btn-primary" (click)="guardarCambios()">Guardar</button>
      </div>
    </div>
  </div>
</div>
