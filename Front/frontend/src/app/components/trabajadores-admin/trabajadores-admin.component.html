<div class="container my-4">
  <h2 class="mb-4">Lista de Trabajadores</h2>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let t of trabajadores">
      <div class="card shadow-sm h-100">
        <img *ngIf="t.imagen"
             [src]="getImageUrl(t.imagen)"
             class="card-img-top"
             alt="Foto del trabajador"
             style="height: 200px; object-fit: cover;">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ t.nombre }}</h5>
          <p class="card-text mb-1"><strong>Especialización:</strong> {{ t.especializacion }}</p>
          <div class="mt-auto d-flex justify-content-between">
            <button class="btn btn-sm btn-primary" (click)="abrirModal(t)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="borrarTrabajador(t.idDetalle_Trabajador)">Borrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" *ngIf="mostrarModal" style="background: rgba(0,0,0,0.5);"></div>

<div class="modal fade" tabindex="-1" [ngClass]="{'show d-block': mostrarModal}" *ngIf="trabajadorSeleccionado">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Trabajador "{{ trabajadorSeleccionado?.nombre }}"</h5>
        <button type="button" class="btn-close" (click)="cerrarModal()"></button>
      </div>
      <div class="modal-body">
        <!-- Nombre -->
        <div class="mb-3">
          <label>Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="trabajadorSeleccionado.nombre" name="nombre">
        </div>

        <!-- Especialización -->
        <div class="mb-3">
          <label>Especialización</label>
          <input type="text" class="form-control" [(ngModel)]="trabajadorSeleccionado.especializacion" name="especializacion">
        </div>

        <!-- Imagen -->
        <div class="mb-3">
          <label>Imagen (nombre del archivo dentro de /img)</label>
          <input type="text" class="form-control" [(ngModel)]="nuevaImagen" name="imagen">
          <p class="mt-2">Vista previa:</p>
          <img [src]="getImageUrl(nuevaImagen)" class="img-fluid rounded" *ngIf="nuevaImagen">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button class="btn btn-success" (click)="guardarCambios()">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>
