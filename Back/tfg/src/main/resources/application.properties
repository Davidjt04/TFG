#Cambio de puerto
server.port=8081

#Nombre de la app
spring.application.name=tfg
#Configuración BD
spring.datasource.url=jdbc:mysql://localhost:3306/tfg
spring.datasource.username=root
spring.datasource.password=root

#Configuracion de hibernate
    #le indica que debe de usar mysql para comunicarse con la bd correctamente
    # spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

    #indica que se realicen los cambios automaticamente cuando la bd va a iniciar (cuando inicia la app)
    spring.jpa.hibernate.ddl-auto=update

    #indica que no cambie los nombres de las tablas a snakeCase
    spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    #indica que muestre las consultas sql por consola
    spring.jpa.show-sql=true

    #informacion sobre logs
    logging.level.org.springframework.security=DEBUG
    logging.level.org.springframework.web=DEBUG
    logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

